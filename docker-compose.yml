# docker-compose.yml สำหรับ Personal Finance Dashboard (ใช้ตอนพัฒนาในเครื่อง)
# วิธีใช้: เปิด terminal ในโฟลเดอร์โปรเจกต์ แล้วรัน  docker compose up -d

services:
  # ---------- ฐานข้อมูล PostgreSQL ----------
  db:
    image: postgres:17            # image สำเร็จรูปของ PostgreSQL เวอร์ชัน 17
    container_name: finance-db
    restart: unless-stopped       # เปิดเครื่องใหม่ Docker จะเปิด container ให้เอง
    environment:                  # ค่าเหล่านี้ดึงมาจากไฟล์ .env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"               # พอร์ตเครื่องเรา : พอร์ตใน container (ใช้ 5433 เพราะเครื่องนี้มี PostgreSQL ของ Windows ใช้ 5432 อยู่แล้ว)
    volumes:
      - pgdata:/var/lib/postgresql/data   # เก็บข้อมูลไว้นอก container ลบ container ข้อมูลก็ไม่หาย
    healthcheck:                  # ให้ Docker เช็คว่า database พร้อมใช้งานหรือยัง
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Adminer: หน้าเว็บไว้ดูข้อมูลใน database ----------
  adminer:
    image: adminer
    container_name: finance-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"               # เปิดดูที่ http://localhost:8080
    depends_on:
      db:
        condition: service_healthy   # รอให้ database พร้อมก่อนค่อยเปิด

  # ---------- RustFS: ที่เก็บไฟล์แบบ S3 (ใช้แทน Cloudflare R2 ตอนพัฒนา) ----------
  # R2 กับ RustFS คุยด้วยภาษาเดียวกัน (S3 API) โค้ดจึงเหมือนกัน ต่างกันแค่ค่าใน .env
  # (ใช้ RustFS แทน MinIO เพราะ MinIO เลิกแจก Docker image รุ่นฟรีไปแล้ว)
  storage:
    image: rustfs/rustfs:1.0.1    # ล็อกเวอร์ชันไว้ จะได้ไม่เปลี่ยนเองตอนดึง image ใหม่
    container_name: finance-storage
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}       # ใช้ค่าเดียวกับที่แอปใช้เชื่อมต่อ (จาก .env)
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000"               # S3 API ที่แอปใช้อัปโหลด/ดาวน์โหลดไฟล์
      - "9001:9001"               # หน้าเว็บดูไฟล์ เปิดที่ http://localhost:9001
    volumes:
      - storagedata:/data         # ไฟล์ที่อัปโหลดเก็บใน volume เหมือน database

volumes:
  pgdata:
  storagedata:
